name: Kairo scanner de fundo

# Cron deslocado 1 min APOS a virada da vela M15 (:01/:16/:31/:46): o scanner
# roda logo depois de a vela fechar e o historico fica quase em tempo real.
# O atraso do GitHub continua coberto pelo backfill forward-only do scan_job.
on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kairo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install --quiet numpy pandas requests
      - name: Rodar scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # opcionais — sem eles o resumo diario simplesmente nao envia
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_job.py
